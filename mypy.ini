[mypy]
# config/ and scripts/ are packages imported as config.* and scripts.* from
# the repo root; without this mypy maps config/openbook.py to both "openbook"
# and "config.openbook".
explicit_package_bases = True
namespace_packages = True

[mypy-mako.*]
ignore_missing_imports = True

[mypy-pytconf.*]
ignore_missing_imports = True

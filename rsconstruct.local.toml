# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# The docs/ site renders from tera.templates/docs/, loading config/*.lua with
# load_lua (the pyanyzip pattern; lua because version_str() reads a lowercase
# `tup` global and pylint would reject lowercase module constants).
#
# README.md is kept as a static committed file rather than templated: its
# pydmt snippet generated two package-list sections by iterating config data
# that no longer exists in this form, so freezing preserves the published
# content exactly.
[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

# Runtime deps so CI installs what the lilypond/mako build scripts import
# (pylint/mypy resolve them). These scripts drive the .ly.mako songbook build
# via the Makefile, which is separate from the rsconstruct doc-site render.
[dependencies]
pip = [
    "GitPython",
    "mako",
    "pymysql",
    "python-dateutil",
    "pytconf",
    "requests",
    "tqdm",
    "types-pymysql",
    "types-requests",
    "types-tqdm",
]

# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "openbook"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "GitPython",
    "pymysql",
    "python-dateutil",
    "pytconf",
    "requests",
    "tqdm",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-pymysql",
    "types-python-dateutil",
    "types-requests",
    "types-tqdm",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "pymysql.*",
    "pytconf.*",
    "tqdm.*",
]
ignore_missing_imports = true

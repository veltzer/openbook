# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "openbook"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "GitPython",
    "requests",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pytest.ini_options]
# the tests import scripts.* from the repository root
pythonpath = ["."]

[tool.mypy]
mypy_path = "src:python"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
]
ignore_missing_imports = true
